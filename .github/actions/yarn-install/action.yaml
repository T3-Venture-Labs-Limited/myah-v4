name: Yarn Install
description: Install dependencies with optional hosted-runner disk cleanup
inputs:
  node-version:
    description: Node.js version to install
    required: false
    default: '24'
  cache-node-modules:
    description: Whether to restore and save the node_modules cache
    required: false
    default: 'true'
  min-free-space-gb:
    description: Skip hosted-runner cleanup when this much space is already free
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Free disk space for install
      if: runner.os == 'Linux'
      shell: bash
      env:
        MIN_FREE_SPACE_GB: ${{ inputs.min-free-space-gb }}
      run: bash .github/scripts/ensure-ci-disk-space.sh
    - name: Cache primary key builder
      id: globals
      shell: bash
      env:
        CACHE_INPUT_HASH: >-
          ${{ hashFiles('yarn.lock', '**/package.json', '.yarnrc.yml',
          'yarn.config.cjs', '**/patches/**', '.yarn/releases/**') }}
        NODE_VERSION: ${{ inputs.node-version }}
        CACHE_EVENT: ${{ github.event_name }}
      run: |
        echo "ACTION_SHELL=bash" >> "${GITHUB_OUTPUT}"
        prefix="node_modules-cache-${CACHE_EVENT}-${RUNNER_OS}"
        prefix="${prefix}-${RUNNER_ARCH}-node-${NODE_VERSION}"
        echo "CACHE_KEY_PREFIX=${prefix}-${CACHE_INPUT_HASH}" \
          >> "${GITHUB_OUTPUT}"
        echo 'PATH_TO_CACHE<<EOF' >> $GITHUB_OUTPUT
        echo "node_modules" >> $GITHUB_OUTPUT
        echo "packages/*/node_modules" >> $GITHUB_OUTPUT
        echo 'EOF' >> $GITHUB_OUTPUT
    - name: Setup Node.js and get yarn cache
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ inputs.node-version }}
    - name: Restore node_modules
      if: inputs.cache-node-modules == 'true'
      id: cache-node-modules
      # actions/cache v4.3.0 (restore)
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        key: v4-${{ steps.globals.outputs.CACHE_KEY_PREFIX }}-${{github.sha}}
        restore-keys: v4-${{ steps.globals.outputs.CACHE_KEY_PREFIX }}-
        path: ${{ steps.globals.outputs.PATH_TO_CACHE }}
    - name: Install Dependencies
      if: >-
        inputs.cache-node-modules != 'true' ||
        (steps.cache-node-modules.outputs.cache-hit != 'true' &&
        steps.cache-node-modules.outputs.cache-matched-key == '')
      shell: ${{ steps.globals.outputs.ACTION_SHELL }}
      run: |
        yarn config set enableHardenedMode true
        yarn config set enableScripts false
        yarn --immutable --check-cache
    # Fork PRs on pull_request cannot write to the base repo's cache.
    # The fork guard also protects pull_request_target's write access.
    - name: Save cache
      if: >-
        inputs.cache-node-modules == 'true' &&
        steps.cache-node-modules.outputs.cache-hit != 'true' &&
        steps.cache-node-modules.outputs.cache-matched-key == '' &&
        format('{0}', github.event.pull_request.head.repo.fork) != 'true'
      # actions/cache v4.3.0 (save)
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        key: ${{ steps.cache-node-modules.outputs.cache-primary-key }}
        path: ${{ steps.globals.outputs.PATH_TO_CACHE }}
