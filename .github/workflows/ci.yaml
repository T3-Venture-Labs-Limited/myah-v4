name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.event_name == 'pull_request'
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out pull request
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Set up dependencies
        uses: ./.github/actions/yarn-install
        with:
          min-free-space-gb: '50'
      - name: Restore lint cache
        id: restore-lint-cache
        uses: ./.github/actions/restore-cache
        with:
          key: ci-lint
      - name: Lint affected projects
        run: >-
          npx nx affected -t lint --base=origin/${{ github.base_ref }}
          --head=${{ github.sha }} --parallel=3
      - name: Save lint cache
        uses: ./.github/actions/save-cache
        with:
          key: ${{ steps.restore-lint-cache.outputs.cache-primary-key }}

  typecheck:
    if: github.event_name == 'pull_request'
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out pull request
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Set up dependencies
        uses: ./.github/actions/yarn-install
        with:
          min-free-space-gb: '50'
      - name: Restore typecheck cache
        id: restore-typecheck-cache
        uses: ./.github/actions/restore-cache
        with:
          key: ci-typecheck
      - name: Typecheck affected projects
        run: >-
          npx nx affected -t typecheck --base=origin/${{ github.base_ref }}
          --head=${{ github.sha }} --parallel=2
      - name: Save typecheck cache
        uses: ./.github/actions/save-cache
        with:
          key: ${{ steps.restore-typecheck-cache.outputs.cache-primary-key }}

  unit-tests:
    if: github.event_name == 'pull_request'
    name: unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out pull request
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Set up dependencies
        uses: ./.github/actions/yarn-install
        with:
          min-free-space-gb: '50'
      - name: Restore unit test cache
        id: restore-unit-test-cache
        uses: ./.github/actions/restore-cache
        with:
          key: ci-unit-tests
      # Integration suites provision their services in dedicated workflows.
      - name: Test affected unit projects
        run: >-
          npx nx affected -t test --configuration=ci
          --base=origin/${{ github.base_ref }} --head=${{ github.sha }}
          --exclude=twenty-e2e-testing,twenty-server --parallel=1
      - name: Save unit test cache
        uses: ./.github/actions/save-cache
        with:
          key: ${{ steps.restore-unit-test-cache.outputs.cache-primary-key }}

  container-build:
    name: container build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Build production container for pull request
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          tags: myah-ci:${{ github.sha }}
          push: false
          load: true
          cache-from: type=gha,scope=myah-production-container
      - name: Build production container for main
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          tags: myah-ci:${{ github.sha }}
          push: false
          load: true
          cache-from: type=gha,scope=myah-production-container
          cache-to: type=gha,mode=max,scope=myah-production-container
