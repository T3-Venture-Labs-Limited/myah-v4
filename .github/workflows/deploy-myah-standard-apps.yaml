name: Deploy Myah Standard Apps

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  provision:
    name: Publish and promote Myah standard apps
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Select staging credentials
        if: inputs.environment == 'staging'
        env:
          SELECTED_API_URL: ${{ secrets.MYAH_STAGING_API_URL }}
          SELECTED_APP_PUBLISHER_KEY: >-
            ${{ secrets.MYAH_STAGING_APP_PUBLISHER_KEY }}
          SELECTED_DEPLOYMENT_TOKEN: >-
            ${{ secrets.MYAH_STAGING_STANDARD_APPS_DEPLOYMENT_TOKEN }}
        run: |
          printf 'MYAH_API_URL=%s\n' "$SELECTED_API_URL" >> "$GITHUB_ENV"
          printf 'MYAH_APP_PUBLISHER_KEY=%s\n' \
            "$SELECTED_APP_PUBLISHER_KEY" >> "$GITHUB_ENV"
          printf 'MYAH_STANDARD_APPS_DEPLOYMENT_TOKEN=%s\n' \
            "$SELECTED_DEPLOYMENT_TOKEN" >> "$GITHUB_ENV"

      - name: Select production credentials
        if: inputs.environment == 'production'
        env:
          SELECTED_API_URL: ${{ secrets.MYAH_PRODUCTION_API_URL }}
          SELECTED_APP_PUBLISHER_KEY: >-
            ${{ secrets.MYAH_PRODUCTION_APP_PUBLISHER_KEY }}
          SELECTED_DEPLOYMENT_TOKEN: >-
            ${{ secrets.MYAH_PRODUCTION_STANDARD_APPS_DEPLOYMENT_TOKEN }}
        run: |
          printf 'MYAH_API_URL=%s\n' "$SELECTED_API_URL" >> "$GITHUB_ENV"
          printf 'MYAH_APP_PUBLISHER_KEY=%s\n' \
            "$SELECTED_APP_PUBLISHER_KEY" >> "$GITHUB_ENV"
          printf 'MYAH_STANDARD_APPS_DEPLOYMENT_TOKEN=%s\n' \
            "$SELECTED_DEPLOYMENT_TOKEN" >> "$GITHUB_ENV"

      - name: Verify selected credentials
        run: |
          test -n "$MYAH_API_URL"
          test -n "$MYAH_APP_PUBLISHER_KEY"
          test -n "$MYAH_STANDARD_APPS_DEPLOYMENT_TOKEN"

      - name: Publish Myah Instagram Messaging
        uses: ./.github/actions/deploy-twenty-app
        with:
          api-url: ${{ env.MYAH_API_URL }}
          api-key: ${{ env.MYAH_APP_PUBLISHER_KEY }}
          app-path: packages/twenty-apps/public/myah-instagram-messaging
          workspace-path: .

      - name: Promote Myah Instagram Messaging
        env:
          APPLICATION_UNIVERSAL_IDENTIFIER: 4738ebcd-6662-4ecc-a190-374fa0525951
        run: |
          DEPLOYMENT_HEADER=$(
            printf 'x-myah-apps-deployment-token: %s' \
              "$MYAH_STANDARD_APPS_DEPLOYMENT_TOKEN"
          )
          PROMOTE_URL=$(
            printf '%s/myah/platform/standard-apps/%s/promote' \
              "${MYAH_API_URL%/}" \
              "$APPLICATION_UNIVERSAL_IDENTIFIER"
          )
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "$DEPLOYMENT_HEADER" \
            "$PROMOTE_URL"
