services:
  managed-email-greenmail:
    image: greenmail/standalone:2.1.3
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp
        -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.auth.disabled=true
        -Dgreenmail.verbose=false
    ports:
      - '127.0.0.1:3025:3025'
      - '127.0.0.1:3143:3143'
    restart: 'no'
